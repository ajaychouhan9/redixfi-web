<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RedixFi — offline</title>
<style>
  :root{color-scheme:dark light;--bg:#0b0f1a;--fg:#e8ecf5;--muted:#9aa4b8;--accent:#d4a94e}
  @media (prefers-color-scheme: light){:root{--bg:#f7f8fb;--fg:#141a29;--muted:#5b6578;--accent:#b8873a}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center}
  img{width:72px;height:auto}
  h1{font-size:20px;margin:0}
  p{margin:0;max-width:34ch;line-height:1.5;color:var(--muted);font-size:15px}
  button{margin-top:6px;border:0;border-radius:10px;background:var(--accent);color:#161006;font-weight:600;font-size:15px;padding:10px 20px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="RedixFi" width="72" height="72">
  <h1>You are offline</h1>
  <p>RedixFi shows live prices and readings, so it needs a connection. Nothing is saved on this device. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
